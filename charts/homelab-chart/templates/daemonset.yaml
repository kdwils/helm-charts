{{- if .Values.daemonset.create -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "homelab-chart.fullname" . }}
  labels:
    {{- include "homelab-chart.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "homelab-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.daemonset.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "homelab-chart.labels" . | nindent 8 }}
        {{- with .Values.daemonset.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.daemonset.hostNetwork }}
      hostNetwork: {{ . }}
      {{- end }}
      {{- with .Values.daemonset.hostPID }}
      hostPID: {{ . }}
      {{- end }}
      {{- with .Values.daemonset.hostIPC }}
      hostIPC: {{ . }}
      {{- end }}
      {{- with .Values.daemonset.dnsPolicy }}
      dnsPolicy: {{ . }}
      {{- end }}
      {{- with .Values.daemonset.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "homelab-chart.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.daemonset.podSecurityContext | nindent 8 }}
      {{- $pvcVolumeMounts := list }}
      {{- if and .Values.pvc.create .Values.pvc.pvcs }}
      {{- range .Values.pvc.pvcs }}
      {{- if .mountPath }}
      {{- $pvcVolumeMounts = append $pvcVolumeMounts (include "homelab-chart.pvcVolumeMount" . | fromYaml) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $configMapVolumeMounts := list }}
      {{- if and .Values.configmap.create .Values.configmap.configmaps }}
      {{- range .Values.configmap.configmaps }}
      {{- if .mountPath }}
      {{- $configMapVolumeMounts = append $configMapVolumeMounts (include "homelab-chart.configMapVolumeMount" . | fromYaml) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- $allVolumeMounts := concat $pvcVolumeMounts $configMapVolumeMounts }}
      {{- if .Values.initContainers }}
      initContainers:
      {{- range .Values.initContainers }}
      {{- include "homelab-chart.container" (dict "container" . "root" $ "pvcVolumeMounts" (list)) | nindent 8 }}
      {{- end }}
      {{- end }}
      containers:
        {{- if .Values.daemonset.containers }}
        {{- range .Values.daemonset.containers }}
        {{- include "homelab-chart.container" (dict "container" . "root" $ "pvcVolumeMounts" $allVolumeMounts) | nindent 8 }}
        {{- end }}
        {{- else }}
        {{- $ports := list }}
        {{- if .Values.service.ports }}
        {{- range .Values.service.ports }}
        {{- $ports = append $ports (dict "name" .name "containerPort" (default .port .targetPort) "protocol" (default "TCP" .protocol)) }}
        {{- end }}
        {{- else }}
        {{- $ports = append $ports (dict "name" (default "http" .Values.service.name) "containerPort" (default (default 80 .Values.service.port) .Values.service.targetPort) "protocol" (default "TCP" .Values.service.protocol)) }}
        {{- end }}
        {{- $container := dict "name" .Chart.Name "image" .Values.daemonset.image "securityContext" .Values.daemonset.securityContext "ports" $ports "livenessProbe" .Values.daemonset.livenessProbe "readinessProbe" .Values.daemonset.readinessProbe "resources" .Values.daemonset.resources "volumeMounts" .Values.daemonset.volumeMounts "env" .Values.daemonset.env "envFrom" .Values.daemonset.envFrom "command" .Values.daemonset.command "args" .Values.daemonset.args }}
        {{- include "homelab-chart.container" (dict "container" $container "root" . "pvcVolumeMounts" $allVolumeMounts) | nindent 8 }}
        {{- end }}
      {{- if .Values.extraContainers }}
      {{- range .Values.extraContainers }}
      {{- include "homelab-chart.container" (dict "container" . "root" $ "pvcVolumeMounts" (list)) | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- $volumes := list }}
      {{- if and .Values.pvc.create .Values.pvc.pvcs }}
      {{- range .Values.pvc.pvcs }}
      {{- if .mountPath }}
      {{- $volumes = append $volumes (include "homelab-chart.pvcVolume" . | fromYaml) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if and .Values.configmap.create .Values.configmap.configmaps }}
      {{- range .Values.configmap.configmaps }}
      {{- if .mountPath }}
      {{- $volumes = append $volumes (include "homelab-chart.configMapVolume" . | fromYaml) }}
      {{- end }}
      {{- end }}
      {{- end }}
      {{- if .Values.daemonset.volumes }}
      {{- $volumes = concat $volumes .Values.daemonset.volumes }}
      {{- end }}
      {{- if $volumes }}
      volumes:
        {{- toYaml $volumes | nindent 8 }}
      {{- end }}
      {{- with .Values.daemonset.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemonset.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.daemonset.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
