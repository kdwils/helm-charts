{{- if .Values.verticalPodAutoscaler.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "homelab-chart.fullname" . }}
  labels:
    {{- include "homelab-chart.labels" . | nindent 4 }}
spec:
  targetRef:
    apiVersion: {{ .Values.verticalPodAutoscaler.targetRef.apiVersion | default "apps/v1" }}
    kind: {{ .Values.verticalPodAutoscaler.targetRef.kind | default "Deployment" }}
    name: {{ .Values.verticalPodAutoscaler.targetRef.name | default (include "homelab-chart.fullname" .) }}
  updatePolicy:
    {{- toYaml .Values.verticalPodAutoscaler.updatePolicy | nindent 4 }}
  {{- with .Values.verticalPodAutoscaler.resourcePolicy }}
  resourcePolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- range .Values.verticalPodAutoscalers }}
---
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ .name }}
  labels:
    {{- include "homelab-chart.labels" $ | nindent 4 }}
spec:
  targetRef:
    apiVersion: {{ dig "targetRef" "apiVersion" "apps/v1" . }}
    kind: {{ dig "targetRef" "kind" "Deployment" . }}
    name: {{ dig "targetRef" "name" .name . }}
  updatePolicy:
    {{- toYaml (.updatePolicy | default (dict "updateMode" "Initial")) | nindent 4 }}
  {{- with .resourcePolicy }}
  resourcePolicy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
